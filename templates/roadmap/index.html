<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 8-week build</title>
<!--
  THE ONE PLACE TO EDIT
  Change the block in <script id="plan"> below and the page redraws itself.
  Everything else here is layout. Four tracks is what fits a client's attention;
  five reads as a list and three looks thin.

  Rules that are not cosmetic:
  - A track's "gets" line is the outcome in the client's words, not the task.
    "Found on Google and Maps" beats "technical SEO and citations".
  - Weeks overlap on purpose. A plan where every track waits for the one before
    it reads as eight weeks of nothing, and it is also not how the work runs.
  - The promise line at the bottom names what does NOT get promised. Leave it in.
-->
<style>
  :root {
    color-scheme: light;
    --ink: #101828;
    --ink-2: #475467;
    --ink-3: #8a94a6;
    --line: #e4e7ec;
    --paper: #ffffff;
    --wash: #f7f8fa;
    --accent: #1a6b5a;
    --accent-soft: #e3f1ed;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink-2); font-family: var(--sans);
         font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 22px 72px; }

  header { border-bottom: 1px solid var(--line); padding-bottom: 26px; margin-bottom: 30px; }
  .kicker { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
            color: var(--accent); }
  h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.1; color: var(--ink); margin: 8px 0 10px;
       letter-spacing: -.02em; font-weight: 700; }
  .sub { font-size: clamp(16px, 2.4vw, 18px); color: var(--ink-2); max-width: 46ch; }

  .steps { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line);
           border-radius: var(--r); overflow: hidden; margin-bottom: 34px; }
  .step { background: var(--paper); padding: 20px 22px; display: grid;
          grid-template-columns: 38px 1fr auto; gap: 4px 18px; align-items: baseline; }
  .step .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); grid-row: span 2; }
  .step h2 { font-size: 17px; color: var(--ink); margin: 0; font-weight: 600; }
  .step .weeks { font-family: var(--mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .step .gets { grid-column: 2 / 4; font-size: 15px; color: var(--ink-2); }

  .chart { border: 1px solid var(--line); border-radius: var(--r); padding: 22px; background: var(--wash); }
  .chart h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
              margin: 0 0 16px; font-weight: 600; }
  .grid { display: grid; gap: 7px; }
  .row { display: grid; grid-template-columns: minmax(96px, 150px) 1fr; gap: 14px; align-items: center; }
  .row .label { font-size: 13.5px; color: var(--ink); }
  .bars { position: relative; height: 26px; }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .bar { position: absolute; top: 4px; bottom: 4px; background: var(--accent); border-radius: 4px; }
  .bar.soft { background: var(--accent-soft); border: 1px solid var(--accent); }
  .scale { display: grid; grid-template-columns: minmax(96px, 150px) 1fr; gap: 14px; margin-top: 10px; }
  .scale .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
                  text-transform: uppercase; color: var(--ink-3); }
  .weeknums { position: relative; height: 16px; }
  .weeknums span { position: absolute; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
                   transform: translateX(-50%); }

  .promise { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
             font-size: 14px; color: var(--ink-3); }

  @media (max-width: 560px) {
    .step { grid-template-columns: 30px 1fr; }
    .step .weeks { grid-column: 2; }
    .step .gets { grid-column: 2; }
    .row, .scale { grid-template-columns: 82px 1fr; gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="kicker" id="kicker"></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="steps" id="steps"></div>

  <div class="chart">
    <h3 id="chartTitle"></h3>
    <div class="grid" id="grid"></div>
    <div class="scale">
      <span class="label">Week</span>
      <div class="weeknums" id="weeknums"></div>
    </div>
  </div>

  <p class="promise" id="promise"></p>

</div>

<script id="plan" type="application/json">
{
  "kicker": "The 8-week build",
  "title": "More customers from Google, turned into booked jobs",
  "sub": "One system, built in 8 weeks. Not just SEO.",
  "weeks": 8,
  "chartTitle": "The roadmap",
  "promise": "No ranking promises: results build over 2 to 3 months.",
  "tracks": [
    { "name": "Traffic",          "gets": "Found on Google and Maps",             "from": 2, "to": 7 },
    { "name": "Conversion",       "gets": "A website built to get the call",      "from": 3, "to": 4 },
    { "name": "Sales automation", "gets": "Every enquiry answered and followed up", "from": 1, "to": 8 },
    { "name": "Analytics",        "gets": "What every lead is worth",             "from": 1, "to": 1, "also": [7, 7] }
  ]
}
</script>

<script>
  (function () {
    var plan = JSON.parse(document.getElementById('plan').textContent);
    var W = plan.weeks;

    document.getElementById('kicker').textContent = plan.kicker;
    document.getElementById('title').textContent = plan.title;
    document.getElementById('sub').textContent = plan.sub;
    document.getElementById('chartTitle').textContent = plan.chartTitle;
    document.getElementById('promise').textContent = plan.promise;

    function span(from, to) {
      // Week n occupies the slice from (n-1)/W to n/W of the track's width.
      return { left: ((from - 1) / W * 100) + '%', width: ((to - from + 1) / W * 100) + '%' };
    }

    var steps = document.getElementById('steps');
    plan.tracks.forEach(function (t, i) {
      var weeks = t.also
        ? 'Weeks ' + t.from + ' and ' + t.also[0]
        : (t.from === t.to ? 'Week ' + t.from : 'Weeks ' + t.from + ' to ' + t.to);
      var el = document.createElement('div');
      el.className = 'step';
      el.innerHTML = '<span class="n">Step ' + (i + 1) + '</span>'
        + '<h2></h2><span class="weeks"></span><span class="gets"></span>';
      el.querySelector('h2').textContent = t.name;
      el.querySelector('.weeks').textContent = weeks;
      el.querySelector('.gets').textContent = t.gets;
      steps.appendChild(el);
    });

    var grid = document.getElementById('grid');
    plan.tracks.forEach(function (t) {
      var row = document.createElement('div');
      row.className = 'row';
      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = t.name;
      var bars = document.createElement('div');
      bars.className = 'bars';
      for (var w = 1; w < W; w++) {
        var tick = document.createElement('span');
        tick.className = 'tick';
        tick.style.left = (w / W * 100) + '%';
        bars.appendChild(tick);
      }
      [[t.from, t.to]].concat(t.also ? [t.also] : []).forEach(function (pair) {
        var b = document.createElement('span');
        b.className = 'bar';
        var s = span(pair[0], pair[1]);
        b.style.left = s.left;
        b.style.width = s.width;
        bars.appendChild(b);
      });
      row.appendChild(label);
      row.appendChild(bars);
      grid.appendChild(row);
    });

    var nums = document.getElementById('weeknums');
    for (var w = 1; w <= W; w++) {
      var s = document.createElement('span');
      s.textContent = w;
      s.style.left = ((w - 0.5) / W * 100) + '%';
      nums.appendChild(s);
    }
  })();
</script>
</body>
</html>
