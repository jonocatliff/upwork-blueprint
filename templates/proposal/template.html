<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ece5d7; --paper: #fbf9f4; --ink: #1c1712; --text: #2a231b; --muted: #6f6656;
    --faint: #9a9081; --accent: #c1663e; --accent-deep: #a24f2e; --rule: #e6ded0;
    --open: #b08968; --bar-1: #c1663e; --bar-2: #7d8a6a; --bar-3: #8a7a5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 24px 12px 56px;
         font: 12.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  .sheet { width: 210mm; min-height: 297mm; max-width: 100%; margin: 0 auto; background: var(--paper);
           box-shadow: 0 20px 54px rgba(28,23,18,.12); padding: 20mm 18mm 16mm; }

  /* One rhythm for every block: label, then content. Nothing else competes. */
  .block { margin: 0 0 10mm; padding-top: 5mm; border-top: 1px solid var(--rule); }
  .block:first-of-type { border-top: 0; padding-top: 0; }
  .label { display: flex; align-items: baseline; gap: 3mm; font-size: 10px; letter-spacing: .12em;
           text-transform: uppercase; color: var(--muted); margin: 0 0 4mm; font-weight: 600; }
  .label .n { font-family: Georgia, serif; font-size: 15px; letter-spacing: 0; color: var(--accent);
              font-weight: 400; line-height: 1; }
  p { margin: 0; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm;
         border-bottom: 1px solid var(--rule); padding-bottom: 6mm; margin-bottom: 8mm; }
  .who { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
         margin: 0 0 3mm; }
  h1 { font-family: Georgia, "Iowan Old Style", ui-serif, serif; font-weight: 400; color: var(--ink);
       font-size: 22px; line-height: 1.2; margin: 0 0 2mm; max-width: 108mm; }
  .sub { color: var(--muted); font-size: 12px; }
  .money { margin: 4mm 0 0; display: flex; align-items: baseline; gap: 3mm; flex-wrap: wrap; }
  .money b { font-family: Georgia, serif; font-size: 21px; font-weight: 400; color: var(--ink);
             font-variant-numeric: tabular-nums; }
  .money span { font-size: 11px; color: var(--muted); }

  .sketch { width: 58mm; height: 36mm; object-fit: cover; object-position: 50% 45%;
            border-radius: 1.5mm; flex: none; align-self: center; }
  .lead { font-size: 13px; line-height: 1.55; color: var(--text); max-width: 150mm; margin: 0 0 5mm; }
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm 10mm; }
  .note-pair { }
  .note-pair .said { font-family: Georgia, serif; font-size: 12.5px; line-height: 1.45; color: var(--ink);
                     border-left: 1.5px solid var(--accent); padding-left: 3mm; }
  .note-pair .means { font-size: 10.5px; color: var(--muted); padding-left: 3mm; margin-top: 1mm; }

  .gantt { display: grid; gap: 2.4mm 0; align-items: center; font-size: 10.5px; }
  .gantt .wk { font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
               text-align: center; }
  .row-label { color: var(--text); padding-right: 3mm; display: flex; align-items: center; gap: 2mm;
               line-height: 1.25; }
  .swatch { width: 2px; height: 3.6mm; border-radius: 1px; flex: none; }
  .bar { height: 2.6mm; border-radius: 1.5px; }
  .bar.b1 { background: var(--bar-1); } .bar.b2 { background: var(--bar-2); } .bar.b3 { background: var(--bar-3); }
  .dot { width: 2.8mm; height: 2.8mm; border-radius: 50%; background: var(--ink); margin: 0 auto; }
  .kind { font-size: 9.5px; color: var(--faint); text-align: right; }

  .stones { display: grid; grid-template-columns: repeat(auto-fit, minmax(38mm, 52mm)); gap: 4mm;
            margin-top: 5mm; justify-content: start; }
  .stone { border: 1px solid var(--rule); border-radius: 2mm; padding: 3mm 3.5mm; }
  .stone span { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 1mm; }
  .stone b { font-family: Georgia, serif; font-size: 16px; font-weight: 400; color: var(--ink);
             font-variant-numeric: tabular-nums; }
  .stone.sel { border-color: var(--accent); }
  .stones-note { font-size: 10.5px; color: var(--muted); margin-top: 3mm; }

  .benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 10mm; }
  .benefit { display: grid; grid-template-columns: 3.5mm 1fr; gap: 2mm; }
  .tick { color: var(--accent); font-size: 11px; line-height: 1.4; }
  .benefit b { display: block; font-size: 11px; font-weight: 600; color: var(--ink); }
  .benefit span { font-size: 10.5px; color: var(--muted); }

  .foot { border-top: 1px solid var(--rule); padding-top: 5mm; display: flex;
          justify-content: space-between; align-items: flex-end; gap: 10mm; }
  .fine { font-size: 9.5px; color: var(--faint); }
  .fine p { margin: 0 0 1mm; }
  .cta { background: var(--accent); color: #fff; text-decoration: none; padding: 3mm 6mm;
         border-radius: 2mm; font-size: 12px; font-weight: 600; white-space: nowrap; }

  .missing { color: var(--open); font-style: italic; }

  @media (max-width: 800px) {
    body { padding: 10px 8px 36px; }
    .sheet { padding: 10mm 7mm; min-height: 0; }
    .top, .foot { flex-direction: column; align-items: flex-start; gap: 5mm; }
    .sketch { width: 100%; height: 36mm; }
    .notes, .benefits, .stones { grid-template-columns: 1fr; }
  }
  @media print {
    body { padding: 0; background: #fff; }
    .sheet { box-shadow: none; width: auto; min-height: 0; padding: 0; }
    @page { size: A4 portrait; margin: 14mm; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="top">
    <div>
      <p class="who">{{MEMBER}} · for {{CLIENT}} · {{DATE}}</p>
      <h1>{{HEADLINE}}</h1>
    </div>
    {{SKETCH}}
  </div>

  <div class="block">
    <p class="label"><span class="n">1</span>{{L_STATE}}</p>
    <p class="lead">{{SUMMARY}}</p>
    <div class="notes">{{FACTS}}</div>
  </div>

  <div class="block">
    <p class="label"><span class="n">2</span>{{L_PLAN}}</p>
    <div class="gantt" style="grid-template-columns: 42mm repeat({{WEEKS}}, 1fr) 18mm">
      <span></span>
      {{WEEK_HEADS}}
      {{GANTT_ROWS}}
    </div>
    <p class="money"><b>{{PRICE}}</b> <span>{{PRICE_NOTE}}</span></p>
    <div class="stones">
      {{MILESTONES}}
    </div>
    <p class="stones-note">{{STONES_NOTE}}</p>
  </div>

  <div class="block">
    <p class="label"><span class="n">3</span>{{L_INCLUDED}}</p>
    <div class="benefits">{{INCLUDED}}</div>
  </div>

  <div class="foot">
    <div class="fine">{{FINE}}</div>
    <a class="cta" href="{{CTA_HREF}}">{{CTA}}</a>
  </div>

</div>
</body>
</html>
